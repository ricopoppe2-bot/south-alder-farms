function renderPayrollPanel(){
  const panel=document.getElementById('payroll-page-body');
  const allPPKs=getAllPayPeriodKeys();
  const cwk=currentPayPeriodKey();
  if(!PAYROLL_PERIOD||!allPPKs.includes(PAYROLL_PERIOD))PAYROLL_PERIOD=cwk;

  // Period picker
  const periodOpts=allPPKs.map(ppk=>{
    const isCur=ppk===cwk;
    const lbl=payPeriodLabel(ppk)+(isCur?' (current)':'');
    return`<option value="${ppk}"${PAYROLL_PERIOD===ppk?' selected':''}>${lbl}</option>`;
  }).join('');
  const periodPicker=allPPKs.length?`<select style="padding:5px 10px;font-size:12px;border:1px solid rgba(255,255,255,.3);border-radius:6px;background:rgba(255,255,255,.1);color:#fff;font-family:inherit;cursor:pointer" onchange="selectPayPeriod(this.value)">${periodOpts}</select>`:'<span style="font-size:12px;opacity:.6">No periods yet</span>';

  const tabs=`<div class="payroll-tabs">
    <button class="ptab${PAYROLL_TAB==='timesheet'?' active':''}" onclick="setPayrollTab('timesheet')"><i class="ti ti-clock-hour-4"></i> Timesheets</button>
    <button class="ptab${PAYROLL_TAB==='rates'?' active':''}" onclick="setPayrollTab('rates')"><i class="ti ti-cash"></i> Pay Rates</button>
    <button class="ptab${PAYROLL_TAB==='summary'?' active':''}" onclick="setPayrollTab('summary')"><i class="ti ti-report-money"></i> Summary</button>
  </div>`;

  let body='';

  if(PAYROLL_TAB==='rates'){
    if(!S.people.length||!S.wcs.length){body='<div class="empty"><i class="ti ti-cash"></i>Add people and stations first.</div>';}
    else{
      body=`<p style="font-size:12px;color:var(--text2);margin-bottom:1rem">Set each employee's hourly pay rate per station. Rates feed into payroll calculations for each bi-monthly period.</p>
      <div style="overflow-x:auto"><table class="pay-table">
        <thead><tr><th>Employee</th>${S.wcs.map(w=>`<th>${w.name}</th>`).join('')}</tr></thead>
        <tbody>${S.people.map(p=>`<tr>
          <td>${nameCell(p,true)}</td>
          ${S.wcs.map(wc=>`<td><div style="display:flex;align-items:center;gap:4px">
            <span style="color:var(--text2);font-size:12px">$</span>
            <input class="pay-rate-input" type="number" min="0" step="0.25" value="${getPayRate(p.id,wc.id)||''}" placeholder="0.00" onchange="setPayRateInline('${p.id}','${wc.id}',this.value)">
            <span style="color:var(--text2);font-size:11px">/hr</span>
          </div></td>`).join('')}
        </tr>`).join('')}
        </tbody>
      </table></div>`;
    }
  } else if(PAYROLL_TAB==='timesheet'){
    const ppk=PAYROLL_PERIOD||cwk;
    const periodLogs=S.shiftLogs.filter(l=>l.payPeriodKey===ppk);
    const pendingCount=periodLogs.filter(l=>l.status==='pending').length;
    const loggedCount=periodLogs.filter(l=>l.status==='logged').length;
    const verifiedCount=periodLogs.filter(l=>l.status==='verified').length;
    const disputedCount=periodLogs.filter(l=>l.status==='disputed').length;
    const allVerified=periodLogs.length>0&&verifiedCount===periodLogs.length;

    if(!periodLogs.length){
      body=`<div class="empty"><i class="ti ti-clock"></i>No shift logs for this period yet. Logs are created automatically each day employees are scheduled.</div>`;
    } else {
      const rows=periodLogs.map(log=>{
        const p=S.people.find(x=>x.id===log.personId);
        const wc=S.wcs.find(x=>x.id===log.wcId);
        const rate=getPayRate(log.personId,log.wcId);
        const pay=rate*log.loggedHrs;
        const sc=wc?scFor(wc.id):{bg:'#f1f1f1',tx:'#666',solid:'#999'};
        let sp='';
        if(log.status==='pending')sp=`<span class="status-pill pending"><i class="ti ti-clock" style="font-size:10px"></i> Pending</span>`;
        else if(log.status==='logged')sp=`<span class="status-pill logged"><i class="ti ti-check" style="font-size:10px"></i> Confirmed</span>`;
        else if(log.status==='verified')sp=`<span class="status-pill verified"><i class="ti ti-circle-check" style="font-size:10px"></i> Verified</span>`;
        else if(log.status==='disputed')sp=`<span class="status-pill disputed"><i class="ti ti-alert-triangle" style="font-size:10px"></i> Disputed${log.note?': '+log.note:''}</span>`;
        const actions=log.status==='logged'?`<div class="row-act">
          <input type="number" value="${log.loggedHrs}" min="0" step="0.5" style="width:60px;padding:3px 6px;font-size:12px;border:1px solid var(--border2);border-radius:5px" onchange="adjustLogHours('${log.id}',this.value)" title="Adjust hours">
          <button class="btn xs primary" onclick="verifyLog('${log.id}')"><i class="ti ti-circle-check"></i> Verify</button>
          <button class="btn xs danger" onclick="openModal('disputeLog',{logId:'${log.id}'})"><i class="ti ti-alert-triangle"></i></button>
        </div>`:log.status==='disputed'?`<button class="btn xs" onclick="resetLog('${log.id}')"><i class="ti ti-refresh"></i> Reset</button>`:log.status==='verified'?`<button class="btn xs sm" onclick="resetLog('${log.id}')" style="color:var(--text3)">Unverify</button>`:'';
        return`<tr>
          <td>${p?nameCell(p,true):`<span style="color:var(--text3)">Unknown</span>`}</td>
          <td><span style="background:${sc.bg};color:${sc.tx};padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;border-left:2px solid ${sc.solid}">${wc?.name||'—'}</span></td>
          <td style="font-size:12px;color:var(--text2)">${DS[log.dayOfWeek]||'—'} ${log.dateKey?.slice(5).replace('-','/')}</td>
          <td style="font-size:12px">${fmt(log.shiftStart)}–${fmt(log.shiftEnd)}</td>
          <td><strong>${log.loggedHrs}h</strong></td>
          <td style="font-size:12px;color:var(--text2)">${rate?fmtMoney(pay):'—'}</td>
          <td>${sp}</td>
          <td>${actions}</td>
        </tr>`;
      }).join('');

      const totalPay=periodLogs.reduce((s,l)=>s+getPayRate(l.personId,l.wcId)*l.loggedHrs,0);
      const totalHrs=periodLogs.reduce((s,l)=>s+l.loggedHrs,0);
      const verPay=periodLogs.filter(l=>l.status==='verified').reduce((s,l)=>s+getPayRate(l.personId,l.wcId)*l.loggedHrs,0);
      body=`
        <div class="summary-grid" style="margin-bottom:1rem">
          <div class="summary-box"><div class="sv">${totalHrs.toFixed(1)}</div><div class="sl">Total hours</div></div>
          <div class="summary-box"><div class="sv">${fmtMoney(totalPay)}</div><div class="sl">Total earnings</div></div>
          <div class="summary-box"><div class="sv">${verifiedCount}</div><div class="sl">Verified shifts</div></div>
          <div class="summary-box"><div class="sv">${fmtMoney(verPay)}</div><div class="sl">Verified pay</div></div>
        </div>
        ${loggedCount>0?`<div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:var(--r);padding:8px 12px;margin-bottom:.7rem;font-size:12px;color:#1E40AF;font-weight:600;display:flex;align-items:center;gap:6px"><i class="ti ti-bell"></i> ${loggedCount} shift${loggedCount!==1?'s':''} confirmed by employees — ready to verify.</div>`:''}
        ${pendingCount>0?`<div style="background:#FFFBEB;border:1px solid #FCD34D;border-radius:var(--r);padding:8px 12px;margin-bottom:.7rem;font-size:12px;color:#92400E;font-weight:600;display:flex;align-items:center;gap:6px"><i class="ti ti-clock"></i> ${pendingCount} shift${pendingCount!==1?'s':''} not yet confirmed by employees.</div>`:''}
        ${allVerified?`<div style="background:var(--g3);border:1px solid var(--g4);border-radius:var(--r);padding:8px 12px;margin-bottom:.7rem;font-size:12px;color:var(--g2);font-weight:700;display:flex;align-items:center;gap:6px"><i class="ti ti-circle-check"></i> All shifts verified for this period.</div>`:''}
        <div style="overflow-x:auto"><table class="pay-table">
          <thead><tr><th>Employee</th><th>Station</th><th>Date</th><th>Shift</th><th>Hrs</th><th>Pay</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
    }
  } else if(PAYROLL_TAB==='summary'){
    // Per-person summary across all periods
    const ppk=PAYROLL_PERIOD||cwk;
    const allPPKsAll=getAllPayPeriodKeys();
    if(!allPPKsAll.length){body=`<div class="empty"><i class="ti ti-report-money"></i>No payroll data yet.</div>`;}
    else{
      // Grand totals
      const allVerLogs=S.shiftLogs.filter(l=>l.status==='verified');
      const grandEarned=allVerLogs.reduce((s,l)=>s+getPayRate(l.personId,l.wcId)*l.loggedHrs,0);
      const grandPaid=S.payments.reduce((s,p)=>s+p.amount,0);
      const grandOwing=Math.max(0,grandEarned-grandPaid);

      // Period breakdown
      const periodRows=allPPKsAll.map(pk=>{
        const pLogs=S.shiftLogs.filter(l=>l.payPeriodKey===pk&&l.status==='verified');
        const pPay=pLogs.reduce((s,l)=>s+getPayRate(l.personId,l.wcId)*l.loggedHrs,0);
        const pPaid=S.payments.filter(p=>p.payPeriodKey===pk).reduce((s,p)=>s+p.amount,0);
        const pOwing=Math.max(0,pPay-pPaid);
        const pHrs=pLogs.reduce((s,l)=>s+l.loggedHrs,0);
        const isCur=pk===cwk;
        const st=payPeriodStatus(pk);
        const owingBadge=pOwing>0&&st==='due'?`<span style="background:#FEF3C7;color:#92400E;padding:1px 6px;border-radius:99px;font-size:10px;font-weight:700">OVERDUE</span>`:
          pOwing>0?`<span style="background:#EFF6FF;color:#1E40AF;padding:1px 6px;border-radius:99px;font-size:10px;font-weight:700">Due ${payPeriodDueDate(pk)}</span>`:
          pPaid>0?`<span style="background:var(--g3);color:var(--g2);padding:1px 6px;border-radius:99px;font-size:10px;font-weight:700">Paid</span>`:'';
        return`<tr>
          <td><strong>${payPeriodLabel(pk)}</strong>${isCur?` <span style="background:var(--g3);color:var(--g2);padding:1px 6px;border-radius:99px;font-size:10px;font-weight:700">CURRENT</span>`:''}</td>
          <td style="font-size:12px;color:var(--text2)">Pay date: ${payPeriodDueDate(pk)}</td>
          <td style="font-size:12px">${pHrs.toFixed(1)} hrs</td>
          <td style="font-weight:700">${fmtMoney(pPay)}</td>
          <td style="color:var(--g2);font-weight:700">${fmtMoney(pPaid)}</td>
          <td style="font-weight:800;color:${pOwing>0?'#92400E':'var(--g2)'}">${pOwing>0?fmtMoney(pOwing):'—'} ${owingBadge}</td>
        </tr>`;
      }).join('');

      // Per-employee summary
      const empRows=S.people.map(p=>{
        const pHist=getPersonPayHistory(p.id);
        if(!pHist.length)return'';

let _clockInterval=null;

function renderRosterAndWeather(){
  const rw=document.getElementById('roster-wrap');
  if(!rw)return;
  rw.style.display='flex';
  if(!_clockInterval){_clockInterval=setInterval(updateClock,1000);updateClock();}

  const today=new Date();today.setHours(0,0,0,0);
  const now=new Date();
  const di=dow(today);
  const dk=dateKey(today);

  // ─ Today's roster as chips ─
  const workers=[];
  S.wcs.forEach(wc=>{
    S.people.forEach(person=>{
      const sh=wc.shifts.find(s=>s.personId===person.id);
      if(!sh||!sh.days[di]?.active)return;
      if(isOnLeave(person.id,dk))return;
      workers.push({person,wc,day:sh.days[di],sc:scFor(wc.id)});
    });
  });
  const list=document.getElementById('roster-list');
  if(list){
    if(!workers.length){
      list.innerHTML=`<span class="roster-empty-inline">Nobody scheduled</span>`;
    } else {
      workers.sort((a,b)=>a.day.start.localeCompare(b.day.start));
      list.innerHTML=workers.map(w=>{
        const sc=w.sc;
        const[sh,sm]=w.day.start.split(':').map(Number);
        const[eh,em]=w.day.end.split(':').map(Number);
        const onNow=now>=new Date(today.getFullYear(),today.getMonth(),today.getDate(),sh,sm)&&
                    now< new Date(today.getFullYear(),today.getMonth(),today.getDate(),eh,em);
        return`<span class="roster-chip" style="background:${sc.bg};color:${sc.tx};border-color:${sc.border}" title="${w.wc.name} · ${fmt(w.day.start)}–${fmt(w.day.end)}">
          <span style="width:6px;height:6px;border-radius:50%;background:${sc.solid};flex-shrink:0"></span>
          ${w.person.name.split(' ')[0]}
          ${onNow?`<span style="background:${sc.solid};color:#fff;border-radius:99px;padding:0 4px;font-size:9px">●</span>`:''}
        </span>`;
      }).join('');
    }
  }

  // ─ Next day as chips ─
  const nextShiftList=document.getElementById('next-shift-list');
  const nextLabel=document.getElementById('next-shift-label');
  if(!nextShiftList)return;
  let nextWorkers=[],nextDate=null;
  for(let off=1;off<=7;off++){
    const d=addDays(today,off);const ndi=dow(d);const ndk=dateKey(d);
    const nw=[];
    S.wcs.forEach(wc=>{S.people.forEach(person=>{
      const sh=wc.shifts.find(s=>s.personId===person.id);
      if(!sh||!sh.days[ndi]?.active||isOnLeave(person.id,ndk))return;
      nw.push({person,wc,day:sh.days[ndi],sc:scFor(wc.id)});
    })});
    if(nw.length){nextWorkers=nw;nextDate=d;break;}
  }
  if(!nextWorkers.length){
    nextShiftList.innerHTML=`<span class="roster-empty-inline">None in next 7 days</span>`;
    if(nextLabel)nextLabel.textContent='';
  } else {
    const dayName=sameDay(addDays(today,1),nextDate)?'Tomorrow':DAYS[dow(nextDate)];
    if(nextLabel)nextLabel.textContent=`${dayName} ${nextDate.getDate()}`;
    nextWorkers.sort((a,b)=>a.day.start.localeCompare(b.day.start));
    nextShiftList.innerHTML=nextWorkers.map(w=>{
      const sc=w.sc;
      return`<span class="roster-chip" style="background:${sc.bg};color:${sc.tx};border-color:${sc.border}" title="${w.wc.name} · ${fmt(w.day.start)}–${fmt(w.day.end)}">
        <span style="width:6px;height:6px;border-radius:50%;background:${sc.solid};flex-shrink:0"></span>
        ${w.person.name.split(' ')[0]}
      </span>`;
    }).join('');
  }
}

function updateClock(){
  const el=document.getElementById('live-clock');
  if(!el)return;
  const now=new Date();
  const h=now.getHours(),m=now.getMinutes();
  const ap=h>=12?'PM':'AM';
  el.textContent=`${h%12||12}:${String(m).padStart(2,'0')} ${ap}`;
}

// ── FIREBASE SETUP HANDLERS ──
window.doFbConnect = function() {
  var url = (document.getElementById('fb-url')?.value || '').trim();
  var key = (document.getElementById('fb-key')?.value || '').trim();
  var pid = (document.getElementById('fb-pid')?.value || '').trim();
  var appid = (document.getElementById('fb-appid')?.value || '').trim();
  var errEl = document.getElementById('fb-err');
  if (!url || !key || !pid) { errEl.textContent='Please fill in Database URL, API Key, and Project ID.';errEl.style.display='block';return; }
  errEl.style.display='none';
  var btn = document.querySelector('.fb-btn');
  if(btn){btn.textContent='Connecting…';btn.disabled=true;}
  var cfg = {databaseURL:url,apiKey:key,projectId:pid,appId:appid};
  initFirebase(cfg, function(){
    setFbConfig(cfg);
    document.getElementById('fb-setup').style.display='none';
    startListening();
    showLoginOrApp();
  }, function(err){
    if(btn){btn.innerHTML='<i class="ti ti-plug-connected"></i> Connect &amp; continue';btn.disabled=false;}
    errEl.textContent='Connection failed: '+err;errEl.style.display='block';
  });
};
window.skipFirebase = function(){
  localStorage.setItem('SAF_SKIP_FB','1');
  document.getElementById('fb-setup').style.display='none';
  loadData();
  showLoginOrApp();
};
function showLoginOrApp(){
  try{
    var s=JSON.parse(sessionStorage.getItem('SAF_SESS')||'null');
    if(s&&s.id&&s.username){
      var acc=allAccounts().find(function(a){return a.id===s.id&&a.username===s.username;});
      if(acc){SESSION={id:acc.id,username:acc.username,role:acc.role,displayName:acc.displayName};bootApp();return;}
    }
  }catch(e){}
  document.getElementById('login-screen').style.display='flex';
}
(function(){
  // Config is hardcoded — always connect to Firebase automatically
  initFirebase(SAF_FB_CONFIG, function(){
    startListening();
    showLoginOrApp();
  }, function(err){
    console.warn('Firebase connection failed, using local storage:', err);
    loadData();
    showLoginOrApp();
  });
})();
</script>

    <div id="notices-list"></div>
  </div>

  <div id="schedule-controls" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:.75rem">
    <div class="tab-row" id="tabs"></div>
    <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
      <button class="btn sm" id="btn-list" onclick="setView('list')"><i class="ti ti-list"></i> List</button>
      <div style="position:relative;display:inline-block">
        <button class="btn sm" id="btn-cal" onclick="toggleCalMenu()"><i class="ti ti-calendar"></i><i class="ti ti-chevron-down" style="font-size:10px;margin-left:2px"></i></button>
        <div id="cal-menu" style="display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);box-shadow:var(--shadow-md);z-index:50;min-width:135px;padding:4px">
          <button class="btn sm" style="width:100%;justify-content:flex-start;border:none;border-radius:5px;margin-bottom:2px" onclick="setView('week')"><i class="ti ti-calendar-week"></i> Weekly</button>
          <button class="btn sm" style="width:100%;justify-content:flex-start;border:none;border-radius:5px" onclick="setView('month')"><i class="ti ti-calendar-month"></i> Monthly</button>
        </div>
      </div>
    </div>
  </div>

  <div id="main-panel"></div>
</div>
</div>

<!-- Sync indicator -->
<div id="sync-indicator" style="display:none"></div>

<!-- Payroll Full Page -->
<div id="payroll-page">
  <div class="payroll-page-inner">
    <div class="payroll-topbar">
      <div class="brand">
        <div class="brand-logo" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2)"><i class="ti ti-plant-2"></i></div>
        <div><div class="brand-name">South Alder Farms</div><div class="brand-sub">Payroll</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn ghost" onclick="closePayrollPage()"><i class="ti ti-arrow-left"></i> Back to schedule</button>
      </div>
    </div>
    <div id="payroll-page-body"></div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="ov" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()" id="mbox"></div>
</div>
</body>
</html>
