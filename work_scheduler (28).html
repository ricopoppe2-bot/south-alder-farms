<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>South Alder Farms</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f6f5f0;--bg3:#eeedе6;
  --text:#18180f;--text2:#65645a;--text3:#a4a398;
  --border:#e0ded5;--border2:#c7c5bb;
  --g1:#2a6e35;--g2:#1b4f24;--g3:#e8f5ea;--g4:#c4e8c9;
  --r:8px;--rl:13px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05);
  --shadow-md:0 4px 20px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.06);
  --shadow-lg:0 8px 40px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#dddbd2;color:var(--text);min-height:100vh;font-size:14px}

/* ── LOGIN ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1b4f24;padding:1.5rem;position:relative;overflow:hidden}
#login-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(58,138,71,.55),transparent 70%),radial-gradient(ellipse 60% 50% at 20% 100%,rgba(42,110,53,.4),transparent 60%);pointer-events:none}
.login-box{background:rgba(255,255,255,.97);border-radius:22px;padding:2.75rem 2.5rem 2.25rem;width:100%;max-width:380px;box-shadow:0 24px 70px rgba(0,0,0,.28),0 4px 20px rgba(0,0,0,.12);position:relative;z-index:1}
.login-brand{text-align:center;margin-bottom:2.25rem}
.login-leaf{width:64px;height:64px;background:var(--g1);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin:0 auto 1.1rem;box-shadow:0 6px 20px rgba(27,79,36,.38)}
.login-name{font-size:21px;font-weight:900;color:var(--text);letter-spacing:-.02em;line-height:1.1}
.login-sub{font-size:11px;color:var(--text3);margin-top:5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.lfield{margin-bottom:1.1rem}
.lfield label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.lfield .input-wrap{position:relative}
.lfield .input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text3);pointer-events:none}
.lfield input{width:100%;padding:12px 14px 12px 40px;font-size:14px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);transition:border-color .15s,box-shadow .15s;font-family:inherit}
.lfield input:focus{outline:none;border-color:var(--g1);box-shadow:0 0 0 3px rgba(42,110,53,.12)}
.login-btn{width:100%;padding:13px;font-size:15px;font-weight:800;border:none;border-radius:10px;cursor:pointer;color:#fff;background:var(--g1);transition:background .13s,transform .08s,box-shadow .13s;letter-spacing:.01em;margin-top:.5rem;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(42,110,53,.35)}
.login-btn:hover{background:var(--g2);box-shadow:0 6px 18px rgba(27,79,36,.4)}
.login-btn:active{transform:scale(.98)}
.login-err{background:#fef2f2;border:1.5px solid #fca5a5;border-radius:10px;padding:10px 13px;font-size:12px;color:#991b1b;margin-bottom:1rem;display:flex;align-items:center;gap:8px;font-weight:600}

/* ── APP SHELL ── */
#app-screen{display:none}
.app{max-width:1200px;margin:0 auto;padding:0 1rem 3rem}
.topbar{background:var(--g2);color:#fff;padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:1.25rem;border-radius:0 0 var(--rl) var(--rl);box-shadow:var(--shadow-md)}
.brand{display:flex;align-items:center;gap:11px}
.brand-logo{width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid rgba(255,255,255,.2)}
.brand-name{font-size:17px;font-weight:900;letter-spacing:-.01em;line-height:1}
.brand-sub{font-size:10px;opacity:.6;text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.topbar-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.user-pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:4px 10px 4px 5px;font-size:12px;font-weight:700;color:#fff}
.user-av{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}


/* ── BUTTONS ── */
.btn{padding:7px 13px;font-size:13px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg);cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:all .13s;line-height:1.3;white-space:nowrap;font-weight:600}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--g1);color:#fff;border-color:var(--g1)}
.btn.primary:hover{background:var(--g2)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.btn.danger{color:#a32d2d;border-color:#f09595}
.btn.danger:hover{background:#fdf0f0}
.btn.amber{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.btn.amber:hover{background:#fde68a}
.btn.active{background:var(--g3);color:var(--g2);border-color:var(--g1);font-weight:700}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.xs{padding:3px 7px;font-size:11px}
.btn.icon-only{padding:5px 8px}
.btn.payroll-btn{background:#1a1f35;color:#e2e8ff;border-color:#2d3555}
.btn.payroll-btn:hover{background:#252c4a}

/* ── CARDS ── */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:.95rem 1.15rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap;gap:6px}
.clabel{font-size:11px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:6px}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:13px}
.empty i{font-size:32px;display:block;margin-bottom:.5rem;opacity:.4}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1rem}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:.75rem 1rem;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.stat-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat-val{font-size:22px;font-weight:800;line-height:1;color:var(--text)}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:2px;font-weight:500}

/* ── PEOPLE ── */
.plist{display:flex;flex-wrap:wrap;gap:7px;min-height:30px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);border-radius:var(--r);border:1px solid var(--border);font-size:13px;transition:border-color .12s}
.chip:hover{border-color:var(--border2)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.chip-rm{background:none;border:none;cursor:pointer;color:var(--text3);padding:0;font-size:15px;display:flex;line-height:1}
.chip-rm:hover{color:#a32d2d}

/* ── STATION TABS ── */
.tab-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.station-tab{padding:7px 14px;font-size:13px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--bg);cursor:pointer;color:var(--text2);transition:all .12s;white-space:nowrap;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.station-tab:hover{background:var(--bg2);color:var(--text)}
.station-tab.active{color:#fff;font-weight:700;border-color:transparent}
.station-tab .dot{width:8px;height:8px;border-radius:50%;opacity:.7;flex-shrink:0}
.tab-add{padding:6px 12px;font-size:13px;border-radius:var(--r);border:1.5px dashed var(--border2);background:transparent;cursor:pointer;color:var(--g1);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.tab-add:hover{background:var(--g3);border-color:var(--g1)}

/* ── LIST TABLE ── */
.sch-table{width:100%;border-collapse:collapse;font-size:13px}
.sch-table th{text-align:left;padding:8px 10px;color:var(--text2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--bg2)}
.sch-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.sch-table tr:last-child td{border-bottom:none}
.sch-table tr:hover td{background:#fafaf7}
.badge{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.badge.on{background:var(--g3);color:var(--g2)}
.badge.off{background:var(--bg2);color:var(--text2)}

/* ── CAL ── */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap;gap:8px}
.cal-nav-btns{display:flex;gap:5px;align-items:center}
.cal-title{font-size:15px;font-weight:800;color:var(--text)}
.cal-subview{display:flex;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
.cal-subview .btn{border:none;border-radius:0;border-right:1px solid var(--border2);padding:5px 11px;font-size:12px}
.cal-subview .btn:last-child{border-right:none}
.cal-subview .btn.active{background:var(--g3);color:var(--g2);font-weight:700}
.cal-wrap{overflow-x:auto}
.wk-table{min-width:760px;width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.wk-table th{padding:8px 5px;font-size:11px;font-weight:700;border-bottom:1px solid var(--border);text-align:center;background:var(--bg2);color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.wk-table th.name-col{text-align:left;padding-left:10px;width:148px}
.wk-table th.today-col{background:var(--g3);color:var(--g2)}
.wk-table td{padding:3px 4px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top}
.wk-table td.name-cell{padding:7px 10px;vertical-align:middle;border-right:2px solid var(--border);background:var(--bg)}
.wk-table td.today-cell{background:#f4fbf5}
.wk-table tr:last-child td{border-bottom:none}
.shift-pill{border-radius:5px;padding:3px 6px;margin:2px 0;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:3px;border-left:3px solid transparent}
.shift-pill .sp-edit{background:none;border:none;cursor:pointer;padding:1px 3px;border-radius:3px;font-size:10px;opacity:.6;line-height:1}
.shift-pill .sp-edit:hover{opacity:1;background:rgba(0,0,0,.08)}
.shift-off{color:var(--text3);font-size:11px;text-align:center;padding:4px 0}
.mo-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.mo-table th{padding:7px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);text-align:center;background:var(--bg2);color:var(--text2)}
.mo-table td{padding:4px;border:1px solid var(--border);vertical-align:top;height:90px}
.mo-table td.other-mo{background:var(--bg2)}
.mo-table td.today-mo{background:#f4fbf5;border-color:var(--g1)}
.day-num{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:3px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.today-mo .day-num{background:var(--g1);color:#fff}
.mo-pill{border-radius:4px;padding:1px 5px;font-size:10px;font-weight:700;margin-bottom:2px;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;border-left:2px solid transparent;transition:filter .1s}
.mo-pill:hover{filter:brightness(.92)}
.mo-more{font-size:10px;color:var(--text3);padding:1px 2px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.75rem}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid transparent}

/* ── DAY GRID ── */
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:.5rem}
.day-card{border:1.5px solid var(--border);border-radius:var(--r);padding:8px 6px;background:var(--bg2);transition:all .12s}
.day-card.on{border-color:var(--g1);background:var(--g3)}
.day-card label{font-size:11px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:4px;margin-bottom:5px;cursor:pointer;user-select:none}
.day-card.on label{color:var(--g2)}
.day-card input[type=checkbox]{accent-color:var(--g1);width:13px;height:13px}
.tin{width:100%;padding:4px 5px;font-size:11px;border:1px solid var(--border2);border-radius:5px;background:var(--bg);color:var(--text);margin-top:3px}
.tin:focus{outline:none;border-color:var(--g1)}
.tin:disabled{opacity:.3;cursor:not-allowed}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:400;padding:1rem}
.modal{background:var(--bg);border-radius:var(--rl);border:1px solid var(--border);padding:1.5rem;width:100%;max-width:700px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:.25rem}
.modal .sub{font-size:12px;color:var(--text2);margin-bottom:1rem}
.mfield{margin-bottom:.85rem}
.mfield label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:700}
.mfield input[type=text],.mfield input[type=number],.mfield input[type=password],.mfield select,.mfield textarea{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{outline:none;border-color:var(--g1);box-shadow:0 0 0 2px rgba(42,110,53,.1)}
.mfooter{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem;border-top:1px solid var(--border);padding-top:.9rem;align-items:center}
.row-act{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

/* ── NOTICES ── */
.note-row{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--border);margin-bottom:6px;font-size:13px}
.note-row:last-child{margin-bottom:0}
.note-date{font-size:11px;color:var(--text3);white-space:nowrap;padding-top:1px;font-weight:600;min-width:72px}
.note-text{flex:1;line-height:1.5}
.note-rm{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:0;flex-shrink:0}
.note-rm:hover{color:#a32d2d}

/* ── SHIFT COMPLETE NOTIFICATION (viewer) ── */
.shift-notif{background:#fff;border:2px solid var(--g1);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1rem;box-shadow:0 4px 16px rgba(42,110,53,.18);display:flex;align-items:center;gap:12px}
.shift-notif-icon{width:44px;height:44px;border-radius:50%;background:var(--g3);color:var(--g1);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.shift-notif-body{flex:1}
.shift-notif-title{font-size:14px;font-weight:800;color:var(--g2);margin-bottom:2px}
.shift-notif-sub{font-size:12px;color:var(--text2)}

/* ── PAYROLL PANEL ── */
.payroll-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow)}
.payroll-hdr{background:#1a1f35;color:#e2e8ff;padding:1rem 1.25rem;border-radius:var(--rl) var(--rl) 0 0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.payroll-hdr h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.payroll-tabs{display:flex;gap:3px;background:rgba(255,255,255,.08);border-radius:8px;padding:3px}
.ptab{padding:6px 13px;font-size:12px;font-weight:700;border:none;border-radius:6px;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);transition:all .15s}
.ptab.active{background:rgba(255,255,255,.18);color:#fff}
.payroll-body{padding:1.1rem 1.25rem}
.pay-table{width:100%;border-collapse:collapse;font-size:13px}
.pay-table th{text-align:left;padding:8px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border);color:var(--text2);background:var(--bg2)}
.pay-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.pay-table tr:last-child td{border-bottom:none}
.pay-table tr:hover td{background:#fafaf7}
.pay-rate-input{padding:5px 8px;font-size:13px;border:1px solid var(--border2);border-radius:6px;width:90px;background:var(--bg);color:var(--text);font-family:inherit}
.pay-rate-input:focus{outline:none;border-color:var(--g1)}
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.status-pill.pending{background:#fef3c7;color:#92400e}
.status-pill.logged{background:#DBEAFE;color:#1E40AF}
.status-pill.verified{background:var(--g3);color:var(--g2)}
.status-pill.disputed{background:#fef2f2;color:#991b1b}
.week-section{margin-bottom:1.5rem}
.week-section h4{font-size:13px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.6rem;display:flex;align-items:center;gap:6px}
.verify-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--r);border:1px solid var(--border);margin-bottom:6px;background:var(--bg2);flex-wrap:wrap;gap:8px}
.verify-row.verified-row{background:var(--g3);border-color:var(--g4)}
.verify-row.disputed-row{background:#fef2f2;border-color:#fca5a5}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1rem}
.summary-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem}
.summary-box .sv{font-size:20px;font-weight:900;color:var(--text);line-height:1}
.summary-box .sl{font-size:11px;color:var(--text2);margin-top:3px;font-weight:500}

/* ── USERS TABLE ── */
.user-table{width:100%;border-collapse:collapse;font-size:13px}
.user-table th{text-align:left;padding:8px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--bg2);color:var(--text2)}
.user-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.user-table tr:last-child td{border-bottom:none}


/* ── TODAY'S ROSTER (compact bar) ── */
.roster-bar{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:0;margin-bottom:.85rem;display:flex;align-items:stretch;flex-wrap:wrap;box-shadow:var(--shadow);overflow:hidden;font-size:12px}
.roster-section{display:flex;align-items:center;gap:8px;padding:7px 12px;flex-wrap:wrap;flex:1;min-width:0}
.roster-section+.roster-section{border-left:1px solid var(--border)}
.roster-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);white-space:nowrap;flex-shrink:0}
.roster-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.roster-clock-inline{font-size:12px;font-weight:700;color:var(--g2);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.roster-empty-inline{font-size:11px;color:var(--text3);font-style:italic}
/* Payroll full page */
#payroll-page{display:none;position:fixed;inset:0;background:#eceae2;z-index:200;overflow-y:auto}
.payroll-page-inner{max-width:1200px;margin:0 auto;padding:0 1rem 3rem}
.payroll-topbar{background:#1a1f35;color:#e2e8ff;padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:1.25rem;border-radius:0 0 var(--rl) var(--rl);box-shadow:var(--shadow-md)}

<body>
<script>
/* ============================================================
   AUTH  — completely self-contained, no hashing, no localStorage
   Default accounts are defined here and NEVER written to storage.
   ============================================================ */
var DEFAULT_ACCOUNTS = [
  {id:'_admin',   username:'admin',    password:'saf2026', role:'admin',  displayName:'Admin'},
  {id:'_clay',    username:'clay',     password:'saf2026', role:'admin',  displayName:'Clay'},
  {id:'_ava',     username:'ava',      password:'2026',    role:'viewer', displayName:'Ava'},
  {id:'_courtney',username:'courtney', password:'2026',    role:'viewer', displayName:'Courtney'},
  {id:'_rhys',    username:'rhys',     password:'2026',    role:'viewer', displayName:'Rhys'},
  {id:'_rico',    username:'rico',     password:'2026',    role:'viewer', displayName:'Rico'}
];
var customAccounts = []; // loaded from localStorage after data loads
var SESSION = null;

function isAdmin() {
  return SESSION !== null && SESSION.role === 'admin';
}

function allAccounts() {
  return DEFAULT_ACCOUNTS.concat(customAccounts);
}

function doLogin() {
  var uEl = document.getElementById('l-user');
  var pEl = document.getElementById('l-pass');
  var username = uEl ? uEl.value.trim().toLowerCase() : '';
  var password = pEl ? pEl.value : '';

  if (!username || !password) {
    showLoginError('Please enter your username and password.');
    return;
  }

  var found = null;
  var accounts = allAccounts();
  for (var i = 0; i < accounts.length; i++) {
    if (accounts[i].username.toLowerCase() === username &&
        accounts[i].password === password) {
      found = accounts[i];
      break;
    }
  }

  if (!found) {
    showLoginError('Incorrect username or password — please try again.');
    if (pEl) { pEl.value = ''; pEl.focus(); }
    return;
  }

  SESSION = {id: found.id, username: found.username, role: found.role, displayName: found.displayName};
  try { sessionStorage.setItem('SAF_SESS', JSON.stringify(SESSION)); } catch(e) {}
  bootApp();
}

function showLoginError(msg) {
  var el = document.getElementById('login-error');
  var ml = document.getElementById('login-err-msg');
  if (ml) ml.textContent = msg;
  if (el) {
    el.style.display = 'flex';
    el.style.animation = 'none';
    void el.offsetWidth; // reflow to restart animation
    el.style.animation = 'shake 0.4s ease';
  }
}

function doLogout() {
  SESSION = null;
  try { sessionStorage.removeItem('SAF_SESS'); } catch(e) {}
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('l-user').value = '';
  document.getElementById('l-pass').value = '';
  document.getElementById('login-error').style.display = 'none';
}

/* ============================================================
   DATA  — separate from auth, uses its own localStorage key
   ============================================================ */
var S = {
  people:[], wcs:[], notices:[], activeWC:null,
  payRates:{}, shiftLogs:[], payments:[],
  leaveRequests:[], workerNotes:[], swapRequests:[],
  availability:{}, stationCapacity:{}
};

// ════════════════════════════════════════
// FIREBASE REALTIME DATABASE
// ════════════════════════════════════════
var FB_DB = null;       // Firebase database reference
var FB_REF = null;      // /saf-data reference
var FB_LISTENING = false;
var _saveTimer = null;
var _lastSavedJSON = '';

// ── HARDCODED FIREBASE CONFIG — South Alder Farms ──
var SAF_FB_CONFIG = {
  apiKey:            "AIzaSyCOiIYIxmXpu_rl7P1iTeEDrEb4Idg3XiI",
  authDomain:        "south-alder-farms.firebaseapp.com",
  databaseURL:       "https://south-alder-farms-default-rtdb.firebaseio.com",
  projectId:         "south-alder-farms",
  storageBucket:     "south-alder-farms.firebasestorage.app",
  messagingSenderId: "454575594187",
  appId:             "1:454575594187:web:641189146790ccd49f994e"
};

function getFbConfig() { return SAF_FB_CONFIG; }
function setFbConfig(cfg) { /* config is hardcoded — nothing to save */ }

function initFirebase(cfg, onReady, onError) {
  var scripts = [
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'
  ];
  var loaded = 0;
  function tryInit() {
    loaded++;
    if (loaded < scripts.length) return;
    try {
      if (!firebase.apps || !firebase.apps.length) {
        firebase.initializeApp(SAF_FB_CONFIG);
      }
      FB_DB = firebase.database();
      FB_REF = FB_DB.ref('saf-data');
      onReady();
    } catch(e) {
      onError(e.message || 'Firebase init failed');
    }
  }
  scripts.forEach(function(src) {
    if (document.querySelector('script[src="' + src + '"]')) { tryInit(); return; }
    var s = document.createElement('script');
    s.src = src;
    s.onload = tryInit;
    s.onerror = function() { onError('Failed to load Firebase SDK. Check your internet connection.'); };
    document.head.appendChild(s);
  });
}

function startListening() {
  if (FB_LISTENING || !FB_REF) return;
  FB_LISTENING = true;
  FB_REF.on('value', function(snapshot) {
    var data = snapshot.val();
    if (!data) return;
    // Only update if remote data is different from what we just saved
    var remoteJSON = JSON.stringify(data);
    if (remoteJSON === _lastSavedJSON) return;
    _lastSavedJSON = remoteJSON;
    // Apply remote data to S
    S.people          = data.people          || [];
    S.wcs             = data.wcs             || [];
    S.notices         = data.notices         || [];
    S.activeWC        = data.activeWC        || S.activeWC;
    S.payRates        = data.payRates        || {};
    S.shiftLogs       = data.shiftLogs       || [];
    S.payments        = data.payments        || [];
    S.leaveRequests   = data.leaveRequests   || [];
    S.workerNotes     = data.workerNotes     || [];
    S.swapRequests    = data.swapRequests    || [];
    S.availability    = data.availability   || {};
    S.stationCapacity = data.stationCapacity || {};
    customAccounts    = data.customAccounts  || [];
    showSyncIndicator('synced');
    if (document.getElementById('app-screen').style.display !== 'none') {
      render();
    }
  }, function(err) {
    showSyncIndicator('error');
    console.error('Firebase read error:', err);
  });
}

function save() {
  if (!FB_REF) {
    // Fallback to localStorage if Firebase not set up
    try { localStorage.setItem('SAF_DATA', JSON.stringify(buildSaveObj())); } catch(e) {}
    return;
  }
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function() {
    var obj = buildSaveObj();
    var json = JSON.stringify(obj);
    if (json === _lastSavedJSON) return; // no change
    showSyncIndicator('saving');
    FB_REF.set(obj, function(err) {
      if (err) {
        showSyncIndicator('error');
        // Fallback to localStorage
        try { localStorage.setItem('SAF_DATA', json); } catch(e) {}
      } else {
        _lastSavedJSON = json;
        showSyncIndicator('saved');
      }
    });
  }, 400); // debounce 400ms
}

function buildSaveObj() {
  return {
    people: S.people, wcs: S.wcs, notices: S.notices, activeWC: S.activeWC,
    payRates: S.payRates, shiftLogs: S.shiftLogs, payments: S.payments,
    leaveRequests: S.leaveRequests, workerNotes: S.workerNotes,
    swapRequests: S.swapRequests, availability: S.availability,
    stationCapacity: S.stationCapacity, customAccounts: customAccounts
  };
}

function loadData() {
  // Used as fallback / initial local load before Firebase connects
  var keys = ['SAF_DATA','saf_data','saf_v6','saf_v5','saf_v4'];
  var raw = null;
  for (var k = 0; k < keys.length; k++) {
    raw = localStorage.getItem(keys[k]);
    if (raw) break;
  }
  if (!raw) return;
  try {
    var d = JSON.parse(raw);
    S.people          = d.people          || [];
    S.wcs             = d.wcs             || [];
    S.notices         = d.notices         || [];
    S.activeWC        = d.activeWC        || null;
    S.payRates        = d.payRates        || {};
    S.shiftLogs       = d.shiftLogs       || [];
    S.payments        = d.payments        || [];
    S.leaveRequests   = d.leaveRequests   || [];
    S.workerNotes     = d.workerNotes     || [];
    S.swapRequests    = d.swapRequests    || [];
    S.availability    = d.availability    || {};
    S.stationCapacity = d.stationCapacity || {};
    customAccounts    = d.customAccounts  || [];
  } catch(e) {}
}

function showSyncIndicator(state) {
  var el = document.getElementById('sync-indicator');
  if (!el) return;
  clearTimeout(el._hideTimer);
  el.className = 'sync-indicator';
  if (state === 'saving') {
    el.innerHTML = '<i class="ti ti-cloud-upload" style="font-size:13px"></i> Saving…';
    el.style.display = 'flex';
    el.style.background = '#1E40AF';
  } else if (state === 'saved') {
    el.innerHTML = '<i class="ti ti-cloud-check" style="font-size:13px"></i> Saved';
    el.style.display = 'flex';
    el.style.background = 'var(--g2)';
    el._hideTimer = setTimeout(function() { el.style.display = 'none'; }, 2000);
  } else if (state === 'synced') {
    el.innerHTML = '<i class="ti ti-refresh" style="font-size:13px"></i> Updated';
    el.style.display = 'flex';
    el.style.background = '#5B21B6';
    el._hideTimer = setTimeout(function() { el.style.display = 'none'; }, 2000);
  } else if (state === 'error') {
    el.innerHTML = '<i class="ti ti-cloud-off" style="font-size:13px"></i> Sync error';
    el.style.display = 'flex';
    el.style.background = '#991B1B';
  }
}


function addAccount(username, password, role, displayName) {
  var all = allAccounts();
  for (var i = 0; i < all.length; i++) {
    if (all[i].username.toLowerCase() === username.toLowerCase()) {
      alert('Username already exists.'); return false;
    }
  }
  customAccounts.push({id:'ca_'+uid(), username:username.toLowerCase(), password:password, role:role, displayName:displayName, createdAt:todayStr()});
  save(); return true;
}
function removeAccount(id) {
  for (var i = 0; i < DEFAULT_ACCOUNTS.length; i++) {
    if (DEFAULT_ACCOUNTS[i].id === id) { alert('Cannot remove default accounts.'); return; }
  }
  var admins = allAccounts().filter(function(a){return a.role==='admin';});
  var target = allAccounts().find(function(a){return a.id===id;});
  if (admins.length <= 1 && target && target.role==='admin') { alert('Cannot remove the last admin.'); return; }
  if (SESSION && SESSION.id === id) { alert('Cannot remove your own account.'); return; }
  customAccounts = customAccounts.filter(function(a){return a.id!==id;});
  save();
}
function changePassword(id, np) {
  var a = customAccounts.find(function(x){return x.id===id;});

  {bg:'#DBEAFE',tx:'#1E40AF'},{bg:'#D1FAE5',tx:'#065F46'},{bg:'#FEF3C7',tx:'#92400E'},

function uid(){return Math.random().toString(36).slice(2,8)}
function pcFor(n){let h=0;for(let c of n)h=(h*31+c.charCodeAt(0))%PC.length;return PC[Math.abs(h)]}
function scFor(wcId){const idx=S.wcs.findIndex(w=>w.id===wcId);return SC[Math.max(0,idx)%SC.length]}
function initials(n){return n.split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase()}
function fmt(t){if(!t)return'';const[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';return`${h%12||12}:${String(m).padStart(2,'0')} ${ap}`}
function fmtS(t){if(!t)return'';const[h,m]=t.split(':').map(Number);const ap=h>=12?'p':'a';return`${h%12||12}${m?':'+String(m).padStart(2,'0'):''}${ap}`}
function shiftHours(days){let tot=0;days.forEach(d=>{if(!d.active)return;const[sh,sm]=d.start.split(':').map(Number);const[eh,em]=d.end.split(':').map(Number);let diff=(eh*60+em)-(sh*60+sm);if(diff<=0)diff+=1440;tot+=diff/60});return Math.round(tot*10)/10}
function weekStart(d){const day=d.getDay();const diff=day===0?-6:1-day;const m=new Date(d);m.setDate(d.getDate()+diff);m.setHours(0,0,0,0);return m}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function dow(d){return(d.getDay()+6)%7}
function todayStr(){const t=new Date();return`${MONTHS[t.getMonth()]} ${t.getDate()}, ${t.getFullYear()}`}
function dateKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekKey(d){const m=weekStart(d);return dateKey(m)}
function currentWeekKey(){return weekKey(new Date())}
function defaultDays(){return Array.from({length:7},(_,i)=>({active:i<5,start:'08:00',end:'16:00'}))}
function fmtMoney(n){return'$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function weekLabel(key){if(!key)return'';const[y,mo,d]=key.split('-').map(Number);const mon=new Date(y,mo-1,d);const sun=addDays(mon,6);return`${MONTHS[mon.getMonth()].slice(0,3)} ${mon.getDate()} – ${MONTHS[sun.getMonth()].slice(0,3)} ${sun.getDate()}, ${sun.getFullYear()}`}

// ── PAY PERIOD HELPERS ──
// Period A: 1st–15th, paid on the 22nd (7 days after 15th)
// Period B: 16th–end of month, paid on the 7th of next month (7 days after month end)
function payPeriodKey(dk){
  const[y,mo,d]=dk.split('-').map(Number);
  const half=d<=15?'A':'B';
  return`${y}-${String(mo).padStart(2,'0')}-${half}`;
}
function payPeriodLabel(ppk){
  if(!ppk)return'';
  const[y,mo,half]=ppk.split('-');
  const yr=parseInt(y),m=parseInt(mo)-1;
  const mn=MONTHS[m];
  if(half==='A')return`${mn} 1–15, ${yr}`;
  const lastDay=new Date(yr,m+1,0).getDate();
  return`${mn} 16–${lastDay}, ${yr}`;
}
function payPeriodDueDate(ppk){
  if(!ppk)return'';
  const[y,mo,half]=ppk.split('-');
  const yr=parseInt(y),m=parseInt(mo)-1;
  if(half==='A'){// due 22nd of same month
    return`${MONTHS[m]} 22, ${yr}`;
  } else {// due 7th of next month
    const nd=new Date(yr,m+1,7);
    return`${MONTHS[nd.getMonth()]} 7, ${nd.getFullYear()}`;
  }
}
function currentPayPeriodKey(){return payPeriodKey(dateKey(new Date()))}
function payPeriodStatus(ppk){
  // Is this period's pay date past yet?
  const[y,mo,half]=ppk.split('-');
  const yr=parseInt(y),m=parseInt(mo)-1;
  let due;
  if(half==='A') due=new Date(yr,m,22,0,0,0);
  else due=new Date(yr,m+1,7,0,0,0);
  const today=new Date();today.setHours(0,0,0,0);
  return today>=due?'due':'upcoming';
}

// ── SHIFT LOG ENGINE ──
// Generates log entries for today's scheduled shifts if not already generated
function generateTodaysLogs(){
  const today=new Date();today.setHours(0,0,0,0);
  const di=dow(today);
  const dk=dateKey(today);
  const wk=weekKey(today);
  const ppk=payPeriodKey(dk);
  S.wcs.forEach(wc=>{
    wc.shifts.forEach(sh=>{
      const dayData=sh.days[di];
      if(!dayData?.active)return;
      const exists=S.shiftLogs.find(l=>l.personId===sh.personId&&l.wcId===wc.id&&l.dateKey===dk);
      if(exists)return;
      const hrs=singleDayHours(dayData);
      S.shiftLogs.push({
        id:uid(),personId:sh.personId,wcId:wc.id,
        dayOfWeek:di,dateKey:dk,weekKey:wk,payPeriodKey:ppk,
        scheduledHrs:hrs,loggedHrs:hrs,
        status:'pending',
        loggedAt:null,verifiedAt:null,note:'',
        shiftStart:dayData.start,shiftEnd:dayData.end
      });
    });
  });
  save();
}
function singleDayHours(d){
  const[sh,sm]=d.start.split(':').map(Number);const[eh,em]=d.end.split(':').map(Number);
  let diff=(eh*60+em)-(sh*60+sm);if(diff<=0)diff+=1440;
  return Math.round(diff/60*100)/100;
}
// Called by viewer to confirm their shift is done
function confirmShiftLog(logId){
  const log=S.shiftLogs.find(l=>l.id===logId);
  if(!log||log.status!=='pending')return;
  log.status='logged';log.loggedAt=new Date().toISOString();save();
  checkViewerNotifications();render();
}

function recordPayment(personId,ppk,amount,note){
  S.payments.push({id:uid(),personId,payPeriodKey:ppk,amount:parseFloat(amount)||0,paidOn:todayStr(),paidBy:SESSION?.displayName||'Admin',note:note||''});
  save();renderPayrollPanel();
}
function getPeriodEarnings(personId,ppk){
  return S.shiftLogs.filter(l=>l.personId===personId&&l.payPeriodKey===ppk&&l.status==='verified')
    .reduce((s,l)=>s+getPayRate(l.personId,l.wcId)*l.loggedHrs,0);
}
function getPeriodPaid(personId,ppk){
  return S.payments.filter(p=>p.personId===personId&&p.payPeriodKey===ppk).reduce((s,p)=>s+p.amount,0);
}
function getPeriodOwing(personId,ppk){
  return Math.max(0,getPeriodEarnings(personId,ppk)-getPeriodPaid(personId,ppk));
}
function getAllPayPeriodKeys(){
  const keys=new Set(S.shiftLogs.map(l=>l.payPeriodKey).filter(Boolean));
  S.payments.forEach(p=>{if(p.payPeriodKey)keys.add(p.payPeriodKey)});
  return [...keys].sort().reverse();
}
function getPersonPayHistory(personId){
  // Return array of {ppk, label, dueDate, earned, paid, owing, status, logs, payments}
  const ppks=getAllPayPeriodKeys();
  return ppks.map(ppk=>{
    const logs=S.shiftLogs.filter(l=>l.personId===personId&&l.payPeriodKey===ppk);
    const payments=S.payments.filter(p=>p.personId===personId&&p.payPeriodKey===ppk);
    const earned=getPeriodEarnings(personId,ppk);
    const paid=getPeriodPaid(personId,ppk);
    const owing=Math.max(0,earned-paid);
    const hrs=logs.filter(l=>l.status==='verified').reduce((s,l)=>s+l.loggedHrs,0);
    return{ppk,label:payPeriodLabel(ppk),dueDate:payPeriodDueDate(ppk),earned,paid,owing,hrs,logs,payments,dueSt:payPeriodStatus(ppk)};
  }).filter(r=>r.logs.length>0||r.payments.length>0);
}

  for(let i=0;i<14;i++){

// ── COVERAGE CHECK ──
function getCoverageAlerts(){
  // Only warn about tomorrow — stations with zero people scheduled (or all on leave)
  const today=new Date();today.setHours(0,0,0,0);
  const tomorrow=addDays(today,1);
  const di=dow(tomorrow);
  const dk=dateKey(tomorrow);
  const alerts=[];
  if(!S.wcs.length)return alerts;
  S.wcs.forEach(wc=>{
    if(!wc.shifts.length)return; // station has no shifts set up
    const sc=scFor(wc.id);
    const scheduled=wc.shifts.filter(sh=>sh.days[di]?.active);
    const actuallyWorking=scheduled.filter(sh=>!isOnLeave(sh.personId,dk));
    if(scheduled.length===0||actuallyWorking.length===0){
      const reason=scheduled.length===0?'Nobody scheduled':`All scheduled workers on leave`;
      alerts.push({wc,sc,reason,dayLabel:'Tomorrow',dateLabel:`${MONTHS[tomorrow.getMonth()].slice(0,3)} ${tomorrow.getDate()}`});
    }
  });
  return alerts;
}

function toggleMoreMenu(){const m=document.getElementById('more-menu');m.style.display=m.style.display==='none'?'block':'none'}
function closeMoreMenu(){const m=document.getElementById('more-menu');if(m)m.style.display='none'}
window.toggleMoreMenu=toggleMoreMenu;window.closeMoreMenu=closeMoreMenu;
function toggleCalMenu(){const m=document.getElementById('cal-menu');m.style.display=m.style.display==='none'?'block':'none'}
document.addEventListener('click',e=>{
  const cal=document.getElementById('cal-menu');
  if(cal&&!cal.contains(e.target)&&!e.target.closest('#btn-cal'))cal.style.display='none';
  const more=document.getElementById('more-menu');
  if(more&&!more.contains(e.target)&&!e.target.closest('#more-btn'))more.style.display='none';
});

// ── MODAL ──
function openModal(type,data={}){
  if(!isAdmin()&&['addPerson','editPerson','addWC','renameWC','editShift','addNote','manageUsers'].includes(type))return;
  M={type,...data};renderModal();
}
function closeModal(){M=null;document.getElementById('ov').style.display='none'}

function renderModal(){
  document.getElementById('ov').style.display='flex';
  const box=document.getElementById('mbox');

  if(M.type==='addPerson'||M.type==='editPerson'){
    const p=M.type==='editPerson'?S.people.find(x=>x.id===M.id):null;
    const isEdit=!!p;
    // Get currently assigned stations for this person
    const assignedWcIds=isEdit?S.wcs.filter(w=>w.shifts.some(s=>s.personId===p.id)).map(w=>w.id):[];
    const stationBtns=S.wcs.length?S.wcs.map(w=>{
      const sc=scFor(w.id);
      const on=assignedWcIds.includes(w.id);
      return`<button type="button" id="st-btn-${w.id}" class="station-select-btn${on?' selected':''}"
        style="display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);border:2px solid ${on?sc.solid:sc.border};background:${on?sc.bg:'var(--bg2)'};color:${on?sc.tx:'var(--text2)'};font-weight:700;font-size:13px;cursor:pointer;transition:all .12s;margin:0 4px 6px 0"
        onclick="toggleStationSelect('${w.id}')">
        <span style="width:9px;height:9px;border-radius:50%;background:${sc.solid};flex-shrink:0"></span>${w.name}
        ${on?'<i class="ti ti-check" style="font-size:12px"></i>':''}
      </button>`;
    }).join(''):`<div style="font-size:13px;color:var(--text3)">No stations yet — add stations first.</div>`;

    box.innerHTML=`<h3>${isEdit?'Edit':'Add'} team member</h3>
      <div class="sub">${isEdit?'Update details for '+p.name+'.':'Add someone to South Alder Farms.'}</div>
      <div class="mfield"><label>Full name</label><input type="text" id="m-name" value="${p?.name||''}" placeholder="Jane Smith" autocomplete="off"></div>
      <div class="mfield"><label>Phone (optional)</label><input type="text" id="m-phone" value="${p?.phone||''}" placeholder="250-555-0100"></div>
      <div class="mfield">
        <label>Stations <span style="font-weight:400;color:var(--text3)">— select all that apply</span></label>
        <div id="station-select-wrap" style="margin-top:4px">${stationBtns}</div>
      </div>
      <div class="mfooter">
        ${isEdit?`<button class="btn sm danger" onclick="removePerson('${p.id}');closeModal()"><i class="ti ti-trash"></i> Remove</button><span style="flex:1"></span>`:''}
        <button class="btn sm" onclick="closeModal()">Cancel</button>
        <button class="btn sm primary" onclick="${isEdit?`doEditPerson('${p.id}')`:'doAddPerson()'}"><i class="ti ti-check"></i> ${isEdit?'Save':'Add'}</button>
      </div>`;
    // Store selected stations in a window var
    window._selStations=new Set(assignedWcIds);
    setTimeout(()=>document.getElementById('m-name')?.focus(),40);
  } else if(M.type==='settingsModal'){
    box.innerHTML=`<h3><i class="ti ti-settings" style="vertical-align:-2px;margin-right:7px"></i>Settings</h3>
      <div class="sub">Manage people, stations, and accounts.</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin:1rem 0">
        <div class="card" style="cursor:pointer;margin-bottom:0" onclick="closeModal();openModal('addPerson')">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:38px;height:38px;border-radius:10px;background:var(--g3);color:var(--g2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0"><i class="ti ti-user-plus"></i></div>
            <div><div style="font-weight:700">Add person</div><div style="font-size:12px;color:var(--text2)">Add a new team member to South Alder Farms</div></div>
            <i class="ti ti-arrow-right" style="margin-left:auto;color:var(--text3)"></i>
          </div>
        </div>
        <div class="card" style="cursor:pointer;margin-bottom:0" onclick="closeModal();openModal('addWC')">

            <div style="width:38px;height:38px;border-radius:10px;background:#DBEAFE;color:#1E40AF;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0"><i class="ti ti-layout-grid-add"></i></div>
            <div><div style="font-weight:700">Add station</div><div style="font-size:12px;color:var(--text2)">Create a new work center or station</div></div>
            <i class="ti ti-arrow-right" style="margin-left:auto;color:var(--text3)"></i>
          </div>
        </div>
        <div class="card" style="cursor:pointer;margin-bottom:0" onclick="closeModal();openModal('manageUsers')">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:38px;height:38px;border-radius:10px;background:#EDE9FE;color:#5B21B6;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0"><i class="ti ti-users-group"></i></div>
            <div><div style="font-weight:700">Manage accounts</div><div style="font-size:12px;color:var(--text2)">Add, edit, or remove login accounts</div></div>
            <i class="ti ti-arrow-right" style="margin-left:auto;color:var(--text3)"></i>
          </div>
        </div>
      </div>
        <div class="card" style="cursor:pointer;margin-bottom:0" onclick="openModal('linkAccounts')">

            <div><div style="font-weight:700">Link accounts to employees</div><div style="font-size:12px;color:var(--text2)">Connect login usernames to team member profiles</div></div>
            <i class="ti ti-arrow-right" style="margin-left:auto;color:var(--text3)"></i>
          </div>
        </div>
      </div>
      <div class="mfooter"><button class="btn sm" onclick="closeModal()">Close</button></div>`;

    // Build rows for each person — dropdown of all viewer+admin accounts
    const acctOpts=(person)=>{

      const opts=`<option value="">— Not linked —</option>`+
        allAccounts().map(a=>`<option value="${a.id}"${linked===a.id?' selected':''}>${a.displayName} (${a.username}) — ${a.role}</option>`).join('');
      return opts;

    const rows=S.people.length
      ? S.people.map(p=>{

            <div style="flex:1;min-width:0">

            <select id="link-${p.id}" style="padding:7px 10px;font-size:12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;flex-shrink:0;max-width:220px"

            </select>
          </div>`;
        }).join('')
      : `<div class="empty" style="padding:1.5rem">No team members yet.</div>`;
    box.innerHTML=`<h3><i class="ti ti-link" style="vertical-align:-2px;margin-right:7px"></i>Link accounts to employees</h3>
      <div class="sub">When a viewer logs in, the app uses this link to know which employee they are — for shift confirmations, leave requests, and their personal schedule view.</div>
      <div style="margin:1rem 0">${rows}</div>
      <div class="mfooter">
        <button class="btn sm" onclick="openModal('settingsModal')"><i class="ti ti-arrow-left"></i> Back</button>
        <span style="flex:1"></span>
        <button class="btn sm primary" onclick="closeModal()"><i class="ti ti-check"></i> Done</button>
      </div>`;
  } else if(M.type==='addWC'){
    box.innerHTML=`<h3>Add station</h3>
      <div class="mfield"><label>Station name</label><input type="text" id="m-wc" placeholder="Greenhouse, Harvest, Irrigation…"></div>
      <div class="mfooter"><button class="btn sm" onclick="closeModal()">Cancel</button><button class="btn sm primary" onclick="doAddWC()"><i class="ti ti-check"></i> Add</button></div>`;
    setTimeout(()=>document.getElementById('m-wc')?.focus(),40);
  } else if(M.type==='renameWC'){
    box.innerHTML=`<h3>Rename station</h3>
      <div class="mfield"><label>New name</label><input type="text" id="m-rwc" value="${M.name}"></div>
      <div class="mfooter"><button class="btn sm" onclick="closeModal()">Cancel</button><button class="btn sm primary" onclick="doRenameWC('${M.id}')"><i class="ti ti-check"></i> Save</button></div>`;
    setTimeout(()=>{const el=document.getElementById('m-rwc');el?.focus();el?.select()},40);
  } else if(M.type==='editShift'){
    const wc=S.wcs.find(w=>w.id===M.wcId)||activeWC();
    const p=S.people.find(x=>x.id===M.personId);
    const ex=wc?.shifts.find(s=>s.personId===M.personId);

      <div id="hours-preview" style="margin-top:.75rem;font-size:12px;color:var(--text2)"></div>

        <button class="btn sm" onclick="closeModal()">Cancel</button>
        <button class="btn sm primary" onclick="doSaveShift('${wc?.id}','${M.personId}')"><i class="ti ti-check"></i> Save</button>

    updateHoursPreview();
  } else if(M.type==='addNote'){
    box.innerHTML=`<h3>Post a notice</h3>

      <div class="mfooter"><button class="btn sm" onclick="closeModal()">Cancel</button><button class="btn sm primary" onclick="doAddNote()"><i class="ti ti-check"></i> Post</button></div>`;
    setTimeout(()=>document.getElementById('m-note')?.focus(),40);
  } else if(M.type==='personDetail'){
    const p=S.people.find(x=>x.id===M.id);if(!p)return;
    const pc=pcFor(p.name);
    const stations=S.wcs.filter(w=>w.shifts.some(s=>s.personId===p.id));
    const totalHrs=stations.reduce((sum,wc)=>{const sh=wc.shifts.find(s=>s.personId===p.id);return sum+(sh?shiftHours(sh.days):0)},0);
    const history=getPersonPayHistory(p.id);
    const totalOwing=history.reduce((s,r)=>s+r.owing,0);
    const totalPaid=history.reduce((s,r)=>s+r.paid,0);
    // Station schedule rows
    const stRows=stations.map(wc=>{
      const sh=wc.shifts.find(s=>s.personId===p.id);const sc=scFor(wc.id);
      const days=sh.days.map((d,i)=>d.active?DS[i]:null).filter(Boolean).join(', ');
      const rate=getPayRate(p.id,wc.id);
      return`<tr>
        <td><span style="background:${sc.bg};color:${sc.tx};padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700">${wc.name}</span></td>
        <td style="font-size:12px;color:var(--text2)">${days||'—'}</td>
        <td style="font-size:12px;font-weight:700;color:var(--g2)">${shiftHours(sh.days)} hrs/wk</td>
        <td style="font-size:12px;color:var(--text2)">${rate?fmtMoney(rate)+'/hr':'<span style="color:var(--text3)">—</span>'}</td>
        ${isAdmin()?`<td><button class="btn xs" onclick="closeModal();openModal('editShift',{wcId:'${wc.id}',personId:'${p.id}'})"><i class="ti ti-pencil"></i> Edit</button></td>`:'<td></td>'}
      </tr>`;
    }).join('');
    // Pay history rows
    const payRows=history.map(r=>{
      const owingStyle=r.owing>0?'color:#92400e;font-weight:800':'color:var(--g2);font-weight:700';
      const dueBadge=r.owing>0&&r.dueSt==='due'?`<span style="background:#FEF3C7;color:#92400E;padding:1px 6px;border-radius:99px;font-size:10px;font-weight:700;margin-left:4px">OVERDUE</span>`:
        r.owing>0?`<span style="background:#EFF6FF;color:#1E40AF;padding:1px 6px;border-radius:99px;font-size:10px;font-weight:700;margin-left:4px">Due ${r.dueDate}</span>`:'';
      const payBtns=isAdmin()&&r.owing>0?`<button class="btn xs primary" onclick="closeModal();openModal('recordPayment',{personId:'${p.id}',ppk:'${r.ppk}',owing:${r.owing}})"><i class="ti ti-cash"></i> Pay ${fmtMoney(r.owing)}</button>`:'';

      const pmtList=r.payments.map(pm=>`<div style="font-size:10px;color:var(--text3);display:flex;gap:8px"><span>${pm.paidOn}</span><span>${fmtMoney(pm.amount)}</span><span>${pm.note||''}</span></div>`).join('');

    ${outstandingBanner}
    ${stations.length?`<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:.5rem">Station Schedule</div>
    <table class="sch-table" style="margin-bottom:1.25rem"><thead><tr><th>Station</th><th>Days</th><th>Hrs/wk</th><th>Pay rate</th><th></th></tr></thead><tbody>${stRows}</tbody></table>`:''}
    ${isAdmin()?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem">

    </div>`:''}

    <table class="sch-table"><thead><tr><th>Period</th><th>Hrs</th><th>Earned</th><th>Paid</th><th>Owing</th><th></th></tr></thead><tbody>${payRows}</tbody></table>`:'<div class="empty" style="padding:1rem"><i class="ti ti-calendar-off"></i>No pay history yet.</div>'}
    <div class="mfooter">
      ${isAdmin()?`<button class="btn sm" onclick="closeModal();openModal('editPerson',{id:'${p.id}'})"><i class="ti ti-pencil"></i> Edit</button>
      <button class="btn sm" onclick="openModal('workerNotes',{personId:'${p.id}'})"><i class="ti ti-note"></i> Notes (${getWorkerNotes(p.id).length})</button>

      <span style="flex:1"></span><button class="btn sm" onclick="closeModal()">Close</button>
    </div>`;
  } else if(M.type==='recordPayment'){
    const p=S.people.find(x=>x.id===M.personId);
    const ppk=M.ppk;
    box.innerHTML=`<h3><i class="ti ti-cash" style="vertical-align:-2px;margin-right:6px"></i>Record payment — ${p?.name||''}</h3>

      <div class="mfield"><label>Amount paid ($)</label><input type="number" id="m-pay-amt" value="${M.owing||''}" min="0" step="0.01" placeholder="0.00"></div>
      <div class="mfield"><label>Note (optional)</label><input type="text" id="m-pay-note" placeholder="e-transfer, cheque #1234…"></div>
      <div class="mfooter"><button class="btn sm" onclick="closeModal()">Cancel</button><button class="btn sm primary" onclick="doRecordPayment('${M.personId}','${ppk}')"><i class="ti ti-check"></i> Record payment</button></div>`;
    setTimeout(()=>document.getElementById('m-pay-amt')?.select(),40);
    } else if(M.type==='mySchedule'){
    const me=getMyPerson();
    if(!me){box.innerHTML=`<h3>My schedule</h3><div class="empty"><i class="ti ti-user-question"></i>Your account isn't linked to an employee. Ask your admin to link your account.</div><div class="mfooter"><button class="btn sm" onclick="closeModal()">Close</button></div>`;return;}

    const curPeriod=history.find(r=>r.ppk===currentPPK);

      const sc=scFor(s.wc.id);const isToday=sameDay(s.date,new Date());

      <div class="stub-row"><span>Earned</span><span style="color:var(--g2);font-weight:700">${fmtMoney(curPeriod.earned)}</span></div>

    box.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:1.1rem">
      <div class="av" style="width:48px;height:48px;font-size:17px;background:${pc.bg};color:${pc.tx}">${initials(me.name)}</div>

    </div>

function buildDayGrid(){
  const cards=_editDays.map((d,i)=>`
    <div class="day-card${d.active?' on':''}" id="dc${i}">
      <label><input type="checkbox" ${d.active?'checked':''} onchange="toggleEDay(${i},this.checked)">${DS[i]}</label>
      <input class="tin" type="time" value="${d.start}" ${d.active?'':'disabled'} id="dc${i}-start" onchange="_editDays[${i}].start=this.value;updateHoursPreview()" title="Start">
      <input class="tin" type="time" value="${d.end}" ${d.active?'':'disabled'} id="dc${i}-end" onchange="_editDays[${i}].end=this.value;updateHoursPreview()" title="End">
      ${i===0?`<button type="button" style="margin-top:4px;width:100%;padding:3px 0;font-size:9px;font-weight:700;border:1px dashed var(--g1);border-radius:4px;background:transparent;color:var(--g2);cursor:pointer" onclick="copyMonToAll()" title="Copy Monday to all active days">Copy to all ↓</button>`:''}
    </div>`).join('');
  return cards;
}
function updateHoursPreview(){
  const el=document.getElementById('hours-preview');if(!el)return;
  const hrs=shiftHours(_editDays);const days=_editDays.filter(d=>d.active).length;
  el.innerHTML=days?`<i class="ti ti-clock" style="vertical-align:-2px"></i> <strong>${hrs} hrs/week</strong> across ${days} day${days!==1?'s':''}`:''
}

window.toggleEDay=function(i,c){_editDays[i].active=c;const dc=document.getElementById('dc'+i);if(dc){dc.classList.toggle('on',c);dc.querySelectorAll('.tin').forEach(t=>t.disabled=!c);}updateHoursPreview()}
window.copyMonToAll=function(){
  const mon=_editDays[0];
  if(!mon.active){alert('Enable Monday first, then set its hours before copying.');return;}
  for(let i=1;i<7;i++){
    _editDays[i].start=mon.start;
    _editDays[i].end=mon.end;
    if(_editDays[i].active){
      const startEl=document.getElementById('dc'+i+'-start');
      const endEl=document.getElementById('dc'+i+'-end');
      if(startEl)startEl.value=mon.start;
      if(endEl)endEl.value=mon.end;
    }
  }
  updateHoursPreview();
};
window.doAddPerson=function(){
  const n=document.getElementById('m-name')?.value.trim();if(!n)return;
  const ph=document.getElementById('m-phone')?.value.trim();
  const selWcIds=Array.from(window._selStations||[]);
  closeModal();
  const p={id:uid(),name:n,role:'',phone:ph};
  S.people.push(p);
  // Add to stations with empty schedule (no auto-fill — admin sets hours separately)
  selWcIds.forEach(function(wcId){
    const wc=S.wcs.find(function(w){return w.id===wcId;});if(!wc)return;
    if(!wc.shifts.find(function(s){return s.personId===p.id;})){
      const blankDays=Array.from({length:7},function(){return{active:false,start:'08:00',end:'16:00'};});
      wc.shifts.push({id:uid(),personId:p.id,days:blankDays});
    }
  });
  save();render();
}
window.doEditPerson=function(id){
  const n=document.getElementById('m-name')?.value.trim();if(!n)return;
  const ph=document.getElementById('m-phone')?.value.trim();
  const selWcIds=new Set(Array.from(window._selStations||[]));
  closeModal();
  const p=S.people.find(x=>x.id===id);if(!p)return;
  p.name=n;p.phone=ph;
  // Sync station assignments
  S.wcs.forEach(wc=>{
    const hasShift=wc.shifts.find(s=>s.personId===id);
    if(selWcIds.has(wc.id)&&!hasShift){
      const bd=Array.from({length:7},function(){return{active:false,start:'08:00',end:'16:00'};});wc.shifts.push({id:uid(),personId:id,days:bd});
    } else if(!selWcIds.has(wc.id)&&hasShift){
      wc.shifts=wc.shifts.filter(s=>s.personId!==id);
    }
  });
  save();render();
}

function render(){
  renderStats();renderPeople();renderNotices();renderTabs();renderViewButtons();
  renderShiftNotifications();renderRosterAndWeather();renderCoverageAlerts();updateLeaveBadge();renderMilestones();
  const panel=document.getElementById('main-panel');
  if(!panel)return;
  if(!S.wcs.length){panel.innerHTML='<div class="card"><div class="empty"><i class="ti ti-layout-grid-add"></i>Add a station to start scheduling.</div></div>';return;}
  // Default to 'all' if no active WC set
  if(!S.activeWC)S.activeWC='all';
  if(S.activeWC==='all'){
    if(VIEW==='list')renderAll(panel);
    else renderCal(panel);
    return;
  }
  const wc=activeWC();
  if(!wc){S.activeWC='all';if(VIEW==='list')renderAll(panel);else renderCal(panel);return;}
  if(VIEW==='list')renderList(panel,wc);
  else renderCal(panel);
}

function renderShiftNotifications(){
  const area=document.getElementById('shift-notif-area');if(!area)return;
  if(isAdmin()){area.innerHTML='';return;}
  const pending=getMyPendingLogs();
  if(!pending.length){area.innerHTML='';return;}
  area.innerHTML=pending.map(log=>{
    const wc=S.wcs.find(w=>w.id===log.wcId);
    const today=new Date();
    // Check if shift end time has passed
    const[eh,em]=(log.shiftEnd||'16:00').split(':').map(Number);
    const shiftEndMs=new Date(today.getFullYear(),today.getMonth(),today.getDate(),eh,em,0).getTime();
    const isOver=Date.now()>=shiftEndMs-5*60*1000; // 5 min early window
    if(!isOver)return'';
    return`<div class="shift-notif">
      <div class="shift-notif-icon"><i class="ti ti-clock-check"></i></div>
      <div class="shift-notif-body">
        <div class="shift-notif-title">Your shift is complete — ${wc?.name||'Unknown station'}</div>
        <div class="shift-notif-sub">${fmt(log.shiftStart)} – ${fmt(log.shiftEnd)} &nbsp;·&nbsp; ${log.scheduledHrs} hrs scheduled &nbsp;·&nbsp; Please confirm to log your hours.</div>
      </div>
      <button class="btn primary" style="flex-shrink:0" onclick="confirmShiftLog('${log.id}')"><i class="ti ti-check"></i> Confirm shift done</button>
    </div>`;
  }).filter(Boolean).join('');
}

function renderCal(panel){if(CAL_SUB==='week')renderWeek(panel);else renderMonth(panel)}

function renderWeek(panel){
  const today=new Date();today.setHours(0,0,0,0);
  const mon=weekStart(CAL_DATE);
  const days=Array.from({length:7},(_,i)=>addDays(mon,i));
  const label=`${MONTHS[mon.getMonth()]} ${mon.getDate()} – ${MONTHS[addDays(mon,6).getMonth()]} ${addDays(mon,6).getDate()}, ${addDays(mon,6).getFullYear()}`;
  const isThisWk=sameDay(mon,weekStart(today));

  // Filter controls
  const wcOpts=`<option value="all">All stations</option>`+S.wcs.map(w=>`<option value="${w.id}"${CAL_FILTER_WC===w.id?' selected':''}>${w.name}</option>`).join('');
  const pOpts=`<option value="all">All people</option>`+S.people.map(p=>`<option value="${p.id}"${CAL_FILTER_PERSON===p.id?' selected':''}>${p.name}</option>`).join('');

  // Apply filters — which people to show
  let showPeople=S.people;
  if(CAL_FILTER_PERSON!=='all') showPeople=S.people.filter(p=>p.id===CAL_FILTER_PERSON);
  if(CAL_FILTER_WC!=='all'){
    const wc=S.wcs.find(w=>w.id===CAL_FILTER_WC);
    if(wc) showPeople=showPeople.filter(p=>wc.shifts.some(s=>s.personId===p.id));
  }
  // Which WCs to consider
  const showWCs=CAL_FILTER_WC==='all'?S.wcs:S.wcs.filter(w=>w.id===CAL_FILTER_WC);

  const navBar=`<div class="cal-toolbar" style="margin-bottom:.75rem">
    <div class="cal-nav-btns">
      <button class="btn sm" onclick="navWeek(-1)"><i class="ti ti-chevron-left"></i></button>
      <button class="btn sm" onclick="goToday()"${isThisWk?' style="color:var(--g2);border-color:var(--g1);font-weight:700"':''}>Today</button>
      <button class="btn sm" onclick="navWeek(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <span class="cal-title">${label}</span>
  </div>`;

  const filterBar=`<div class="cal-filter-bar">
    <select onchange="setCalFilterWC(this.value)">${wcOpts}</select>
    <select onchange="setCalFilterPerson(this.value)">${pOpts}</select>
    <div class="cal-view-toggle">
      <button class="btn${CAL_WEEK_MODE==='timeline'?' active':''}" onclick="setCalWeekMode('timeline')"><i class="ti ti-layout-rows"></i> Timeline</button>
      <button class="btn${CAL_WEEK_MODE==='grid'?' active':''}" onclick="setCalWeekMode('grid')"><i class="ti ti-table"></i> Grid</button>
    </div>
  </div>`;

  let body='';
  if(CAL_WEEK_MODE==='grid'){
    // ── Original grid view ──
    const headers=days.map((d,i)=>{const isTod=sameDay(d,today);return`<th class="${isTod?'today-col':''}">${DS[i]}<br><span style="font-size:13px;font-weight:${isTod?800:500}">${d.getDate()}</span></th>`}).join('');
    const rows=showPeople.map(person=>{
      const cells=days.map((d,di)=>{
        const isTod=sameDay(d,today);
        const blocks=showWCs.map(wc=>{
          const sh=wc.shifts.find(s=>s.personId===person.id);
          if(!sh||!sh.days[di]?.active)return null;
          const sc=scFor(wc.id);const dd=sh.days[di];
          return`<div class="shift-pill" style="background:${sc.bg};color:${sc.tx};border-left-color:${sc.solid}">
            <span>${fmtS(dd.start)}–${fmtS(dd.end)}</span>
            <span style="font-size:9px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40px">${wc.name}</span>
            ${isAdmin()?`<button class="sp-edit" onclick="openModal('editShift',{wcId:'${wc.id}',personId:'${person.id}'})" title="Edit"><i class="ti ti-pencil"></i></button>`:''}
          </div>`;
        }).filter(Boolean).join('');
        return`<td class="${isTod?'today-cell':''}">${blocks||`<div class="shift-off">—</div>`}</td>`;
      }).join('');
      return`<tr><td class="name-cell">${nameCell(person,true)}</td>${cells}</tr>`;
    }).join('');
    body=`<div class="cal-wrap"><table class="wk-table"><thead><tr><th class="name-col">Person</th>${headers}</tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No people match filters.</td></tr>'}</tbody></table></div>`;
  } else {
    // ── Timeline view: one row per person×day, shifts as horizontal bars ──
    // Show 7 days as tabs, each day shows a timeline
    const now=new Date();
    const selDay=CAL_FILTER_WC!=='all'||CAL_FILTER_PERSON!=='all'?null:null; // always show all 7
    const START_HR=4; // timeline starts at 4am
    const END_HR=24;  // ends at midnight
    const TOTAL_HRS=END_HR-START_HR;

    // Hours header
    const hrsHeader=Array.from({length:TOTAL_HRS},(_,i)=>{
      const h=i+START_HR;const label=h===12?'12p':h===0||h===24?'12a':h<12?h+'a':(h-12)+'p';
      return`<div class="tl-hour-hdr">${label}</div>`;
    }).join('');

    // Now line position
    const nowHr=now.getHours()+now.getMinutes()/60;
    const nowPct=((nowHr-START_HR)/TOTAL_HRS*100).toFixed(2);

    // One sub-table per visible day
    const dayTables=days.map((d,di)=>{
      const isTod=sameDay(d,today);
      const dateLabel=`${DS[di]} ${d.getDate()}`;

      // Collect all shift bars for this day
      const personRows=showPeople.map(person=>{
        const bars=showWCs.map(wc=>{
          const sh=wc.shifts.find(s=>s.personId===person.id);
          if(!sh||!sh.days[di]?.active)return null;
          const sc=scFor(wc.id);
          const dd=sh.days[di];
          const[sh2,sm]=dd.start.split(':').map(Number);
          const[eh,em]=dd.end.split(':').map(Number);
          let startFrac=(sh2+sm/60-START_HR)/TOTAL_HRS;
          let endFrac=(eh+em/60-START_HR)/TOTAL_HRS;
          if(endFrac<=startFrac)endFrac+=24/TOTAL_HRS; // overnight
          startFrac=Math.max(0,Math.min(1,startFrac));
          endFrac=Math.max(0,Math.min(1,endFrac));
          const left=(startFrac*100).toFixed(2);
          const width=((endFrac-startFrac)*100).toFixed(2);
          const dur=singleDayHours(dd);
          const editBtn=isAdmin()?`<button class="tl-edit" onclick="openModal('editShift',{wcId:'${wc.id}',personId:'${person.id}'})" title="Edit"><i class="ti ti-pencil"></i></button>`:'';
          return`<div class="tl-shift-bar" style="left:${left}%;width:${width}%;background:${sc.bg};color:${sc.tx};border-left-color:${sc.solid}" title="${wc.name}: ${fmt(dd.start)}–${fmt(dd.end)} (${dur}h)">
            <span style="overflow:hidden;text-overflow:ellipsis;flex:1">${wc.name} ${fmtS(dd.start)}–${fmtS(dd.end)}</span>

          </div>`;
        }).filter(Boolean).join('');
        if(!bars)return'';
        const pc=pcFor(person.name);
        return`<div class="tl-row">
          <div class="tl-name"><div class="av" style="width:22px;height:22px;font-size:8px;background:${pc.bg};color:${pc.tx};flex-shrink:0">${initials(person.name)}</div>${person.name.split(' ')[0]}</div>
          <div class="tl-cells">${Array.from({length:TOTAL_HRS},(_,hi)=>`<div class="tl-cell"></div>`).join('')}

      if(!personRows)return'';

      return`<div style="margin-bottom:1rem">
        <div style="font-size:12px;font-weight:800;color:${isTod?'var(--g2)':'var(--text2)'};padding:6px 0 4px;display:flex;align-items:center;gap:6px">
          ${isTod?`<span style="background:var(--g1);color:#fff;padding:1px 7px;border-radius:99px;font-size:10px">TODAY</span>`:''}
          ${dateLabel}
        </div>
        <div class="timeline-wrap" style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
          <div class="timeline-grid">
            <div class="tl-header">
              <div class="tl-name-hdr">Person</div>
              ${hrsHeader}
            </div>
            ${personRows}
          </div>
        </div>
      </div>`;
    }).filter(Boolean).join('');

    body=dayTables||`<div class="empty"><i class="ti ti-calendar-off"></i>No shifts match the current filters.</div>`;
  }

  const subViewBtns=`<div class="cal-subview"><button class="btn active"><i class="ti ti-calendar-week"></i> Week</button><button class="btn" onclick="setView('month')"><i class="ti ti-calendar-month"></i> Month</button></div>`;

  panel.innerHTML=`<div class="card">
    <div class="card-hdr"><span class="clabel"><i class="ti ti-calendar-week"></i> Weekly Schedule</span>${subViewBtns}</div>
    ${stationLegend()}
    ${navBar}
    ${filterBar}
    ${!S.people.length?'<div class="empty"><i class="ti ti-user-plus"></i>Add team members first.</div>':body}
  </div>`;
}

function renderMonth(panel){
  const today=new Date();today.setHours(0,0,0,0);
  const year=CAL_DATE.getFullYear(),month=CAL_DATE.getMonth();
  const gridStart=addDays(new Date(year,month,1),-dow(new Date(year,month,1)));
  const gridDays=Array.from({length:42},(_,i)=>addDays(gridStart,i));
  const isThisMo=today.getFullYear()===year&&today.getMonth()===month;
  function cellHTML(d){
    const di=dow(d);const otherMo=d.getMonth()!==month;const isTod=sameDay(d,today);
    const entries=[];
    S.wcs.forEach(wc=>{S.people.forEach(person=>{
      const sh=wc.shifts.find(s=>s.personId===person.id);
      if(sh&&sh.days[di]?.active){const sc=scFor(wc.id);entries.push({person,wc,day:sh.days[di],sc});}
    })});
    const show=entries.slice(0,3);const extra=entries.length-3;
    const pills=show.map(e=>`<div class="mo-pill" style="background:${e.sc.bg};color:${e.sc.tx};border-left-color:${e.sc.solid}" onclick="${isAdmin()?`openModal('editShift',{wcId:'${e.wc.id}',personId:'${e.person.id}'})`:'void(0)'}" title="${e.person.name} @ ${e.wc.name}">
      <span style="overflow:hidden;text-overflow:ellipsis;flex:1">${e.person.name.split(' ')[0]}</span>
      <span style="font-size:9px;opacity:.75;flex-shrink:0">${fmtS(e.day.start)}</span>
    </div>`).join('');
    return`<td class="${otherMo?'other-mo':''}${isTod?' today-mo':''}">
      <div class="day-num">${d.getDate()}</div>${pills}${extra>0?`<div class="mo-more">+${extra} more</div>`:''}
    </td>`;
  }
  let tbody='';for(let r=0;r<6;r++)tbody+=`<tr>${gridDays.slice(r*7,(r+1)*7).map(d=>cellHTML(d)).join('')}</tr>`;
  panel.innerHTML=`<div class="card">
    <div class="card-hdr"><span class="clabel"><i class="ti ti-calendar-month"></i> Monthly Schedule</span>
      <div class="cal-subview"><button class="btn" onclick="setView('week')"><i class="ti ti-calendar-week"></i> Week</button><button class="btn active"><i class="ti ti-calendar-month"></i> Month</button></div>
    </div>
    ${stationLegend()}
    <div class="cal-toolbar">
      <div class="cal-nav-btns">
        <button class="btn sm" onclick="navMonth(-1)"><i class="ti ti-chevron-left"></i></button>
        <button class="btn sm" onclick="goToday()"${isThisMo?' style="color:var(--g2);border-color:var(--g1);font-weight:700"':''}>Today</button>
        <button class="btn sm" onclick="navMonth(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <span class="cal-title">${MONTHS[month]} ${year}</span><span></span>
    </div>
    ${!S.people.length?'<div class="empty"><i class="ti ti-user-plus"></i>Add team members first.</div>':`
    <table class="mo-table"><thead><tr>${DS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${tbody}</tbody></table>`}
  </div>`;
}

// ─── SWAP MODAL ───────────────────────────────
function renderSwapModal(box){
  box=box||document.getElementById('mbox');if(!box)return;
  const pending=S.swapRequests.filter(r=>r.status==='open');
  const others=S.swapRequests.filter(r=>r.status!=='open').slice(0,15);
  function swapRow(r){
    const from=S.people.find(x=>x.id===r.fromPersonId);
    const to=r.toPersonId?S.people.find(x=>x.id===r.toPersonId):null;
    const wc=S.wcs.find(x=>x.id===r.wcId);
    const sc=wc?scFor(wc.id):{bg:'#eee',tx:'#666',solid:'#aaa'};
    return`<div class="swap-row">
      <div style="flex:1;min-width:0">
        <div style="font-weight:700">${from?.name||'Unknown'} wants to swap a shift</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px"><span style="background:${sc.bg};color:${sc.tx};padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700">${wc?.name||'—'}</span> on ${r.dateKey||'—'}${to?' &nbsp;↔&nbsp; '+to.name:''}</div>
        ${r.note?`<div style="font-size:12px;color:var(--text3);margin-top:2px">"${r.note}"</div>`:''}
        ${r.reviewedBy?`<div style="font-size:11px;color:var(--text3);margin-top:2px">Reviewed by ${r.reviewedBy}</div>`:''}
      </div>
      <span class="swap-badge ${r.status}">${r.status}</span>
      ${isAdmin()&&r.status==='open'?`<div class="row-act">
        <button class="btn xs primary" onclick="reviewSwap('${r.id}','approved')"><i class="ti ti-check"></i></button>
        <button class="btn xs danger" onclick="reviewSwap('${r.id}','denied')"><i class="ti ti-x"></i></button>
      </div>`:''}
      ${isAdmin()?`<button class="btn xs danger icon-only" onclick="deleteSwap('${r.id}');renderSwapModal()"><i class="ti ti-trash"></i></button>`:''}
    </div>`;
  }
  box.innerHTML=`<h3><i class="ti ti-arrows-exchange" style="vertical-align:-2px;margin-right:6px"></i>Shift swap requests</h3>
    <div class="sub">Review and approve requests from employees to swap shifts.</div>
    ${pending.length?`<div class="section-hdr"><i class="ti ti-clock"></i> Pending (${pending.length})</div>${pending.map(swapRow).join('')}<br>`:''}
    ${others.length?`<div class="section-hdr"><i class="ti ti-history"></i> Recent decisions</div>${others.map(swapRow).join('')}`:''}
    ${!S.swapRequests.length?'<div class="empty"><i class="ti ti-arrows-exchange"></i>No swap requests yet.</div>':''}
    <div class="mfooter"><button class="btn sm" onclick="closeModal()">Close</button></div>`;
}

// ─── SEARCH ───────────────────────────────────
window.doSearch=function(q){
  const el=document.getElementById('m-search-results');if(!el)return;
  const query=q.trim().toLowerCase();
  if(!query){el.innerHTML='<div style="font-size:12px;color:var(--text3);padding:.5rem">Start typing to search…</div>';return;}
  const results=[];
  S.people.forEach(p=>{
    const score=(p.name.toLowerCase().includes(query)?3:0)+(p.role?.toLowerCase().includes(query)?2:0)+(p.phone?.includes(query)?1:0);
    if(score>0){const pc=pcFor(p.name);results.push({type:'person',score,html:`<div class="search-result-item" onclick="closeModal();openModal('personDetail',{id:'${p.id}'})">
      <div class="av" style="width:30px;height:30px;font-size:11px;background:${pc.bg};color:${pc.tx};flex-shrink:0">${initials(p.name)}</div>
      <div><div style="font-weight:700">${p.name}</div><div style="font-size:11px;color:var(--text2)">${p.role||'No role'}</div></div>
      <span style="margin-left:auto;font-size:11px;color:var(--text3)">Person</span>
    </div>`,});}
  });
  S.wcs.forEach(w=>{
    if(w.name.toLowerCase().includes(query)){const sc=scFor(w.id);results.push({type:'station',score:3,html:`<div class="search-result-item" onclick="closeModal();setActiveWC('${w.id}')">
      <span style="width:10px;height:10px;border-radius:50%;background:${sc.solid};flex-shrink:0;display:inline-block"></span>
      <div><div style="font-weight:700">${w.name}</div><div style="font-size:11px;color:var(--text2)">${w.shifts.length} assigned</div></div>
      <span style="margin-left:auto;font-size:11px;color:var(--text3)">Station</span>
    </div>`,});}
  });
  results.sort((a,b)=>b.score-a.score);
  el.innerHTML=results.length?results.map(r=>r.html).join(''):`<div style="font-size:13px;color:var(--text3);padding:.75rem">No results for "${q}"</div>`;
};
